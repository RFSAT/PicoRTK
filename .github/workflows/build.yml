name: Build PicoRTK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.2.0); leave empty for a plain build"
        required: false
        default: ""

env:
  ARDUINO_PICO_VERSION: 6.3.0
  ARDUINOJSON_VERSION: 7.4.2


# The Release step creates GitHub releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Host unit tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Ifirmware/PicoRTK test/test_main.cpp \
            firmware/PicoRTK/nmea.cpp firmware/PicoRTK/rtcm.cpp firmware/PicoRTK/selector.cpp firmware/PicoRTK/methods.cpp firmware/PicoRTK/sky.cpp firmware/PicoRTK/evtrim.cpp firmware/PicoRTK/ntrip_proto.cpp firmware/PicoRTK/ladder.cpp -o /tmp/t
          /tmp/t

      - name: Protocol test against the fake caster
        run: |
          g++ -std=c++17 -Ifirmware/PicoRTK test/caster_e2e.cpp firmware/PicoRTK/ntrip_proto.cpp firmware/PicoRTK/rtcm.cpp -o /tmp/e2e
          python3 tools/fake_caster.py --port 21010 & sleep 1
          /tmp/e2e 21010 GOOD | tee /tmp/r1; grep -q "^Ok frames=[1-9]" /tmp/r1
          /tmp/e2e 21010 NOPE | grep -q "^Sourcetable"
          /tmp/e2e 21010 AUTH | grep -q "^Unauthorized"
          /tmp/e2e 21010 AUTH test:test | grep -q "^Ok frames=[1-9]"

      # Pinned arduino-cli release (the install.sh script fails now and then on GitHub runners)
      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1

      # The core and its toolchains (about 300 MB) are cached, so most runs download nothing
      - name: Cache the Pico core
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-pico-${{ env.ARDUINO_PICO_VERSION }}-json-${{ env.ARDUINOJSON_VERSION }}

      # GitHub's release downloads time out now and then (HTTP 504): retry each install up to 4 times
      - name: Install the Pico core
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed, retrying in $((i * 20)) s"; sleep $((i * 20)); done; return 1; }
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          retry arduino-cli core update-index
          retry arduino-cli core install rp2040:rp2040@${ARDUINO_PICO_VERSION}
          retry arduino-cli lib install ArduinoJson@${ARDUINOJSON_VERSION}

      - name: Build UF2
        run: |
          VERSION=${{ inputs.release_tag || '' }}; [ -n "$VERSION" ] || VERSION=$(git describe --tags --always)
          PICORTK_VERSION=$VERSION bash tools/build.sh
          mv build/PicoRTK.ino.uf2 build/PicoRTK-$VERSION.uf2
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: PicoRTK-${{ env.VERSION }}
          path: build/PicoRTK-*.uf2

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          # Versions below 1.0 and versions with a suffix (v1.2.0-rc1) are published as pre-releases
          prerelease: ${{ startsWith(inputs.release_tag || github.ref_name, 'v0.') || contains(inputs.release_tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: build/PicoRTK-*.uf2
